<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}

.foot{padding:40px 6vw;font-size:13px;opacity:.7;border-top:1px solid #eadfd5}
@media(max-width:760px){.nav ul{display:none}section{padding:64px 6vw}}

.nums{display:flex;gap:44px;margin-top:40px;flex-wrap:wrap}.nums b{font-size:44px;font-weight:900;color:#B4541E;display:block}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.ct{background:#fff;border-radius:20px;padding:26px 18px;text-align:center;font-weight:800;border:1px solid #eadfd5;transition:.3s}.ct:hover{border-color:#B4541E;transform:translateY(-6px)}
.ct i{display:block;width:54px;height:54px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,#E8A33D,#B4541E)}
@media(max-width:760px){.cats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>

<script>const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e));</script></body></html>

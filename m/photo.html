<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDIO LUMEN</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Pretendard,'Noto Sans CJK KR',sans-serif;background:#FFFFFF;color:#141414;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 6vw;background:rgba(255,255,255,.85);backdrop-filter:blur(10px)}
.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand em{font-style:normal;color:#141414}
.nav ul{display:flex;gap:26px;list-style:none;font-weight:600;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;background:#8C7A62;color:#fff;padding:14px 24px;border-radius:999px;font-weight:800;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.btn.ghost{background:transparent;color:#141414;border:2px solid #141414;box-shadow:none}
section{padding:90px 6vw}
h1{font-size:clamp(44px,7vw,96px);line-height:1.02;letter-spacing:-2px;font-weight:900}
h2{font-size:clamp(30px,4vw,52px);letter-spacing:-1px;font-weight:900;margin-bottom:28px}
.eye{font-weight:800;letter-spacing:4px;font-size:13px;color:#141414;margin-bottom:18px;text-transform:uppercase}
.rv{opacity:0;transform:translateY(40px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.on{opacity:1;transform:none}
.foot{padding:40px 6vw;font-size:13px;opacity:.7;border-top:1px solid #eee}
@media(max-width:760px){.nav ul{display:none}section{padding:64px 6vw}}
.hero h1{font-size:clamp(60px,12vw,200px);letter-spacing:-8px;line-height:.9}
.grid{columns:3 280px;column-gap:16px}.ph{break-inside:avoid;margin-bottom:16px;border-radius:6px;overflow:hidden;position:relative;transition:.6s}.ph:hover{filter:none;transform:scale(.98)}
.ph span{position:absolute;left:14px;bottom:12px;color:#fff;font-weight:700;font-size:14px;letter-spacing:2px}
</style></head><body>
<nav class="nav"><a class="brand" href="#">LUMEN</a><ul><li><a href="#work">작업</a></li><li><a href="#about">소개</a></li><li><a href="#contact">문의</a></li></ul><a class="btn" href="#cta">촬영 문의</a></nav>
<section class="hero"><div class="eye rv" style="color:#999">Portrait · Wedding · Brand</div><h1 class="rv">LIGHT<br>STAYS.</h1></section>
<section id="work" style="padding-top:0"><div class="grid">
<div class="ph rv" style="height:420px;background:linear-gradient(160deg,#f4d6c6,#8f6b5c)"><span>PORTRAIT</span></div><div class="ph rv" style="height:300px;background:linear-gradient(200deg,#cfd8c6,#55664d)"><span>OUTDOOR</span></div><div class="ph rv" style="height:360px;background:linear-gradient(140deg,#e8e0f0,#6f6487)"><span>WEDDING</span></div>
<div class="ph rv" style="height:280px;background:linear-gradient(120deg,#f6ead2,#b08c4f)"><span>BRAND</span></div><div class="ph rv" style="height:440px;background:linear-gradient(180deg,#e3e3e3,#4a4a4a)"><span>MONO</span></div><div class="ph rv" style="height:320px;background:linear-gradient(160deg,#ffd9c7,#d0603f)"><span>FAMILY</span></div></div></section>
<section id="contact" class="rv"><h2>원하시는 날짜를 알려주세요</h2><a class="btn" href="#">촬영 문의 →</a></section><footer class="foot">STUDIO LUMEN · 이 화면은 웹쇼룸 전시용 시안입니다 (가상의 상호)</footer>
<script>const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e));</script></body></html>

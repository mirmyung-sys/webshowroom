<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한우 담</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Pretendard,'Noto Sans CJK KR',sans-serif;background:#F5EDE3;color:#3B1A1A;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 6vw;background:rgba(245,237,227,.9);backdrop-filter:blur(10px)}
.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand em{font-style:normal;color:#8E2B2B}
.nav ul{display:flex;gap:26px;list-style:none;font-weight:600;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;background:#8E2B2B;color:#F5EDE3;padding:14px 24px;border-radius:999px;font-weight:800;font-size:16px;box-shadow:0 10px 30px rgba(142,43,43,.35)}
.btn.ghost{background:transparent;color:#3B1A1A;border:2px solid #3B1A1A;box-shadow:none}
section{padding:90px 6vw}
h1{font-size:clamp(44px,7vw,96px);line-height:1.02;letter-spacing:-2px;font-weight:900}
h2{font-size:clamp(30px,4vw,52px);letter-spacing:-1px;font-weight:900;margin-bottom:28px}
.eye{font-weight:800;letter-spacing:4px;font-size:13px;color:#8E2B2B;margin-bottom:18px;text-transform:uppercase}
.rv{opacity:0;transform:translateY(40px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.on{opacity:1;transform:none}
.foot{padding:40px 6vw;font-size:13px;opacity:.7;border-top:1px solid #e2cdb8}
@media(max-width:760px){.nav ul{display:none}section{padding:64px 6vw}}
.hero{min-height:92vh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:140vmax;height:140vmax;border-radius:50%;background:repeating-radial-gradient(circle,#8E2B2B10 0 2px,transparent 2px 40px);animation:spin2 90s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(70px,13vw,190px);font-weight:900;letter-spacing:-6px;color:#8E2B2B;position:relative}
.course{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.co{border:2px solid #8E2B2B;border-radius:30px;padding:36px}.co small{letter-spacing:3px;font-weight:800;color:#8E2B2B}.co b{display:block;font-size:30px;margin:10px 0}.co span{font-size:24px;font-weight:900}
@media(max-width:760px){.course{grid-template-columns:1fr}}
</style></head><body>
<nav class="nav"><a class="brand" href="#">한우 <em>담</em></a><ul><li><a href="#course">코스</a></li><li><a href="#room">룸</a></li><li><a href="#rsv">예약</a></li></ul><a class="btn" href="#cta">예약</a></nav>
<section class="hero"><div><div class="eye rv">Korean Beef Dining</div><h1 class="rv">담다.</h1><p class="rv" style="font-size:21px;margin:10px 0 34px">1++ 한우를, 조용한 룸에서.</p><a class="btn rv" href="#rsv">룸 예약 →</a></div></section>
<section id="course"><div class="eye">Course</div><h2 class="rv">코스</h2><div class="course"><div class="co rv"><small>LUNCH</small><b>점심 정식</b><span>39,000원</span></div><div class="co rv"><small>DINNER</small><b>저녁 코스</b><span>89,000원</span></div><div class="co rv"><small>SPECIAL</small><b>담 코스</b><span>129,000원</span></div></div></section>
<section id="rsv" class="rv" style="text-align:center"><h2>상견례 · 접대 · 가족모임</h2><a class="btn" href="#">예약 문의 →</a></section><footer class="foot">한우 담 · 이 화면은 웹쇼룸 전시용 시안입니다 (가상의 상호)</footer>
<script>const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e));</script></body></html>
